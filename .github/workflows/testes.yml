# CI da suíte de testes do BRDATA (motor de testes, Fase C).
#
# - "Rota rápida": smoke de fluxos críticos + unitários (suites.json → fast).
#   Primeiro sinal em poucos minutos; NÃO substitui a suíte completa.
# - "Suíte completa": os 153 testes divididos em 4 máquinas em paralelo
#   (run_parallel.js --shard=I/4 — a divisão é a mesma em qualquer máquina,
#   ver suites.json → durationsMs). Cada máquina sobe seu próprio servidor
#   isolado com dados vazios (--isolated-server).
# - "Carreira 2.0": unitários, tipos e build da v2 (ver o job).
# Nada aqui pula teste nem repete teste que falhou: o código de saída de
# cada script é o veredito (ver tests/e2e/README.md).
name: Testes

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Mesma versão do playwright-core de tests/e2e/package.json — o navegador
  # instalado tem que ser o que essa versão espera.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

jobs:
  # Carreira 2.0 (AUD-07): o frontend React em carreira-v2/ é servido a partir
  # do build versionado em public/carreira/ (o Dockerfile só copia public/).
  # Aqui: dependências travadas (npm ci), testes unitários, checagem de
  # tipos e a garantia de que o build versionado é exatamente o da fonte —
  # assim os E2E abaixo, que usam public/carreira/, testam a fonte certa.
  carreira-v2:
    name: Carreira 2.0 (unitários, tipos e build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22: os unitários usam --experimental-strip-types (Node ≥ 22.6).
          node-version: 22
          cache: npm
          cache-dependency-path: carreira-v2/package-lock.json
      - name: Dependências
        working-directory: carreira-v2
        run: npm ci
      - name: Testes unitários
        working-directory: carreira-v2
        run: npm test
      - name: Checagem de tipos
        working-directory: carreira-v2
        run: npm run typecheck
      - name: Build versionado = build da fonte
        run: .github/scripts/verificar-bundle-v2.sh

  rapida:
    name: Rota rápida
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Plano Postgres (08/11): o servidor isolado de cada máquina grava num
    # Postgres de verdade (um banco novo por servidor, ver
    # tests/_pg_temporario.js), como em produção.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      BRDATA_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar-testes
      - name: Rodar rota rápida
        working-directory: tests/e2e
        run: node run_parallel.js --suite=fast --isolated-server
      - name: Resumo
        if: always()
        working-directory: tests/e2e
        run: node ../../.github/scripts/resumo-testes.js "Rota rápida" >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-rapida
          path: |
            tests/e2e/_last_parallel_run.json
            tests/e2e/_artifacts/
          if-no-files-found: ignore
          retention-days: 14

  completa:
    name: Suíte completa (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Plano Postgres (08/11): o servidor isolado de cada máquina grava num
    # Postgres de verdade (um banco novo por servidor, ver
    # tests/_pg_temporario.js), como em produção.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      BRDATA_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar-testes
      - name: Rodar parte ${{ matrix.shard }} de 4
        working-directory: tests/e2e
        run: node run_parallel.js --isolated-server --shard=${{ matrix.shard }}/4
      - name: Resumo
        if: always()
        working-directory: tests/e2e
        run: node ../../.github/scripts/resumo-testes.js "Suíte completa — parte ${{ matrix.shard }}/4" >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-completa-${{ matrix.shard }}
          path: |
            tests/e2e/_last_parallel_run.json
            tests/e2e/_artifacts/
          if-no-files-found: ignore
          retention-days: 14
