name: Preparar testes
description: Node, dependências do servidor e da suíte e-2-e, e o Chromium do playwright-core (com cache).
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          server/package-lock.json
          tests/e2e/package-lock.json
    - name: Dependências do servidor
      shell: bash
      working-directory: server
      run: npm ci
    - name: Dependências da suíte
      shell: bash
      working-directory: tests/e2e
      run: npm ci
    - name: Versão do playwright-core
      id: pw
      shell: bash
      working-directory: tests/e2e
      run: echo "versao=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache do Chromium
      id: cache-pw
      uses: actions/cache@v4
      with:
        path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        key: pw-chromium-${{ runner.os }}-${{ steps.pw.outputs.versao }}
    - name: Instalar Chromium
      if: steps.cache-pw.outputs.cache-hit != 'true'
      shell: bash
      working-directory: tests/e2e
      run: npx playwright-core install --with-deps chromium
    # A imagem do runner já traz as bibliotecas do Chromium; o que costuma
    # faltar são só fontes extras. Se os espelhos do Ubuntu estiverem fora do
    # ar (11/11/2026: DNS do apt falhando, 10–20 min por tentativa e nenhum
    # teste rodado), segue com aviso em até 3 min em vez de derrubar o job:
    # se faltar algo de verdade, os testes falham e mostram o quê.
    - name: Dependências de sistema do Chromium (cache reaproveitado)
      if: steps.cache-pw.outputs.cache-hit == 'true'
      shell: bash
      working-directory: tests/e2e
      run: |
        if ! timeout 180 npx playwright-core install-deps chromium; then
          echo "::warning::Não foi possível instalar as dependências de sistema do Chromium (espelhos do apt indisponíveis?); seguindo com as da imagem do runner."
        fi
